<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontak | [NAMA LENGKAP]</title>
<meta name="description" content="Kirim pesan atau hubungi lewat email.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="kontak">
<a class="skip" href="#isi">Lewati ke konten</a>
<header id="hdr"></header>
<main id="isi" tabindex="-1">
<section class="wrap">
  <h1>Kontak</h1>
  <div class="contact-grid">
    <form id="form" novalidate>
      <label for="nama">Nama</label><input id="nama" name="nama" autocomplete="name" required>
      <label for="mail">Email Anda</label><input id="mail" name="email" type="email" autocomplete="email" required>
      <label for="pesan">Pesan</label><textarea id="pesan" name="pesan" required></textarea>
      <p><button class="btn pri" type="submit">Kirim lewat aplikasi email</button></p>
      <p id="msg" class="msg" role="status"></p>
    </form>
    <div>
      <h2>Langsung</h2>
      <p id="email"></p>
      <p><button class="btn" id="salin" type="button">Salin email</button></p>
      <ul id="tautan" class="plain"></ul>
    </div>
  </div>
</section>
</main>
<footer id="ftr"></footer>
<noscript><p class="wrap">Situs ini memerlukan JavaScript untuk menampilkan isinya.</p></noscript>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
